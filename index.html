        function attemptUnlock() {
            const k = document.getElementById('pass').value;
            try {
                // Try to turn the jumbled mess back into code
                const bytes = CryptoJS.AES.decrypt(_DATA_STORE, k);
                const decryptedCode = bytes.toString(CryptoJS.enc.Utf8);

                // If password is wrong, decryptedCode will be empty string or malformed
                if (!decryptedCode) throw "Wrong Key";

                // SUCCESS: Wipe the current page and write the real code
                document.open();
                document.write(decryptedCode);
                document.close();
            } catch (e) {
                // FAILURE
                alert("ACCESS DENIED: Invalid Key or Corrupted Data");
                console.error("Decryption failed. Data remains jumbled.");
            }
        }

        // Allow Enter key
        document.getElementById('pass').addEventListener("keypress", function(e) {
            if (e.key === "Enter") attemptUnlock();
        });
