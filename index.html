<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forever Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --rose: #ff4d6d; --cream: #fff0f3; --text: #5e2c3a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }

        /* --- 1. LOCK SCREEN --- */
        #lockscreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('bg.jpg'), var(--rose);
            background-size: cover; background-position: center;
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; transition: 0.8s;
        }
        .unlocked { transform: translateY(-100%); }
        .timer { display: flex; gap: 10px; margin: 20px 0; }
        .unit { background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; min-width: 60px; }
        .btn-enter { padding: 15px 40px; background: white; color: var(--rose); border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }

        /* --- 2. MAIN SITE --- */
        #main-site { display: none; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { font-family: 'Parisienne', cursive; font-size: 3rem; color: var(--rose); }

        /* --- 3. GALLERY (The Important Part) --- */
        .gallery { display: flex; gap: 15px; overflow-x: auto; padding: 20px 0; }
        .polaroid { 
            flex: 0 0 240px; background: white; padding: 10px 10px 30px 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;
        }
        .polaroid img { 
            width: 100%; height: 240px; object-fit: cover; 
            background: #ffe3e3; /* This shows a pink box if the image is missing */
            display: block;
        }
        .polaroid p { font-family: 'Parisienne', cursive; margin-top: 10px; font-size: 1.2rem; }

        /* --- 4. THE GAME --- */
        .game-box { position: relative; height: 300px; border: 2px dashed var(--rose); border-radius: 15px; overflow: hidden; margin-top: 10px; }
        .btn-game { padding: 12px 30px; border-radius: 50px; border: none; position: absolute; cursor: pointer; font-weight: bold; }
        .yes { background: var(--rose); color: white; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .no { background: #eee; color: #555; left: 50%; top: 20%; transform: translateX(-50%); transition: 0.2s; }

        #success { position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:20000; display:none; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

    <audio id="music" loop><source src="https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3" type="audio/mp3"></audio>

    <div id="lockscreen">
        <h1 style="color: white;">For You ❤️</h1>
        <div class="timer">
            <div class="unit"><span id="h">00</span>h</div>
            <div class="unit"><span id="m">00</span>m</div>
            <div class="unit"><span id="s">00</span>s</div>
        </div>
        <button class="btn-enter" onclick="start()">Tap to Enter ❤️</button>
    </div>

    <div id="main-site">
        <div class="card">
            <h1>Happy Valentine's!</h1>
            <p>I made this for you...</p>
        </div>

        <div class="gallery">
            <!-- These try to load your images. If they fail, you see a pink box. -->
            <div class="polaroid"><img src="1.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 1</p></div>
            <div class="polaroid"><img src="2.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 2</p></div>
            <div class="polaroid"><img src="3.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 3</p></div>
            <div class="polaroid"><img src="4.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 4</p></div>
            <div class="polaroid"><img src="5.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 5</p></div>
            <div class="polaroid"><img src="6.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 6</p></div>
            <div class="polaroid"><img src="7.jpg" onerror="this.src='https://via.placeholder.com/240x240/ffc0cb/ffffff?text=❤️'"><p>Memory 7</p></div>
        </div>

        <div class="card">
            <h2>Will You Be My Valentine?</h2>
            <div class="game-box" id="area">
                <button class="btn-game yes" onclick="win()">YES!</button>
                <button class="btn-game no" id="no">No</button>
            </div>
        </div>
    </div>

    <div id="success">
        <h1 style="color:var(--rose)">YAY! ❤️</h1>
        <p>I love you!</p>
        <button onclick="location.reload()" style="margin-top:20px;">Back</button>
    </div>

    <script>
        function start() {
            document.getElementById('music').play().catch(()=>{});
            document.getElementById('lockscreen').classList.add('unlocked');
            document.getElementById('main-site').style.display = 'block';
        }

        const target = new Date("February 14, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            if (diff > 0) {
                document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);

        const no = document.getElementById('no');
        const area = document.getElementById('area');
        function move(e) {
            if(e) e.preventDefault();
            const a = area.getBoundingClientRect();
            const b = no.getBoundingClientRect();
            no.style.left = Math.random() * (a.width - b.width) + 'px';
            no.style.top = Math.random() * (a.height - b.height) + 'px';
        }
        no.addEventListener('touchstart', move);
        no.addEventListener('mouseover', move);

        function win() { document.getElementById('success').style.display='flex'; }
    </script>
</body>
</html>
